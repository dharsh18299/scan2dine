<!DOCTYPE html>
<html>
<head>
    <title>Split Order Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f0fdf4; padding: 20px; }
        .container { max-width: 550px; margin: auto; }
        .card { background: white; padding: 25px; margin-bottom: 15px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,.1); }
        h1 { text-align: center; color: #15803d; }
        .person { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .amount { font-weight: bold; }
        .button { display: block; text-align: center; text-decoration: none; background: #2563eb; color: white; padding: 13px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🎉 Order Placed!</h1>
        <p>Order ID: <strong>#{{ order_id }}</strong></p>
        <p>Tracking ID: <strong>{{ trackid }}</strong></p>
        <p>Table: <strong>{{ table_no }}</strong></p>
        <hr>
        <h2>Individual Bills</h2>
        {% for i in range(names|length) %}
            <div class="person">
                <span>{{ names[i] }}</span>
                <span class="amount">₹{{ "%.2f"|format(amounts[i]) }}</span>
            </div>
        {% endfor %}
        <hr>
        <h2>Total: ₹{{ "%.2f"|format(grand_total) }}</h2>
        <a href="#" class="button">Track Order</a>
        <a href="#" class="button" style="background: #475569;">Back to Menu</a>
    </div>
</div>
</body>
</html>
