<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiter Called - Scan2Dine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            color: #111827;
            font-size: 30px;
        }

        .success {
            color: #16a34a;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .message {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .table-number {
            display: inline-block;
            background: #fff7ed;
            color: #ea580c;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .back-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">📞</div>

        <h1>Waiter Called!</h1>

        <div class="success">
            Your request has been sent successfully.
        </div>

        <div class="table-number">
            🪑 Table {{ table_no }}
        </div>

        <p class="message">
            A waiter has been notified and will come to your table shortly.
            Please stay at your table.
        </p>

        <a
            href="{{ url_for('menu', table_no=table_no) }}"
            class="back-button"
        >
            🍽️ Back to Menu
        </a>

    </div>

</body>
</html>
