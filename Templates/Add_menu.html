<!DOCTYPE html>
<html>
<head>
    <title>Scan2Dine - Add Menu Item</title>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            color:#333;
        }
        .container{
            width:90%;
            max-width:550px;
            margin:50px auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 5px 18px rgba(0,0,0,.12);
        }
        h1{
            text-align:center;
            color:#d35400;
            margin:5px 0 30px;
        }
        label{
            display:block;
            font-weight:bold;
            margin-bottom:7px;
            color:#555;
        }
        input,textarea{
            width:100%;
            padding:11px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
            margin-bottom:18px;
        }
        textarea{
            height:100px;
            resize:vertical;
        }
        input:focus,textarea:focus{
            outline:none;
            border-color:#e67e22;
        }
        .buttons{
            text-align:center;
            margin-top:10px;
        }
        button{
            background:#27ae60;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background:#219150;
        }
        .back{
            display:inline-block;
            margin-top:20px;
            color:#d35400;
            text-decoration:none;
        }
        .back:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽 Add Menu Item</h1>
        <form method="POST">
            <label>Dish Name</label>
            <input type="text" name="dish_name" required>

            <label>Category</label>
            <input type="text" name="category" required>

            <label>Price</label>
            <input type="number" name="price" min="0" step="0.01" required>

            <label>Description</label>
            <textarea name="description"></textarea>

            <div class="buttons">
                <button type="submit">➕ Add Item</button>
            </div>
        </form>
        <div class="buttons">
            <a class="back" href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
