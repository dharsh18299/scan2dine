<!DOCTYPE html>
<html>
<head>
    <title>Scan2Dine - Order Placed</title>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            text-align:center;
        }
        .box{
            width:90%;
            max-width:550px;
            margin:70px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 18px rgba(0,0,0,.15);
        }
        .success{
            font-size:60px;
        }
        h1{
            color:#27ae60;
            margin:10px 0;
        }
        h3{
            color:#555;
            margin-top:30px;
        }
        .code{
            background:#fff8dc;
            padding:18px;
            border-radius:8px;
            border:2px dashed #f39c12;
            font-size:25px;
            font-weight:bold;
            color:#d35400;
            letter-spacing:2px;
            margin:20px 0;
        }
        p{
            color:#666;
            line-height:25px;
        }
        .buttons{
            margin-top:25px;
        }
        a{
            text-decoration:none;
        }
        button{
            border:none;
            padding:12px 25px;
            border-radius:7px;
            cursor:pointer;
            font-size:16px;
            margin:5px;
            color:white;
        }
        .track{
            background:#27ae60;
        }
        .menu{
            background:#e67e22;
        }
        button:hover{
            opacity:.85;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="success">✅</div>
        <h1>Order Placed Successfully!</h1>
        <h3>Your Tracking Code</h3>
        <div class="code">
            {{ trackid }}
        </div>
        <p>Please save this tracking code. You can use it to track your order and access your bill after the order is delivered.</p>
        <div class="buttons">
            <a href="{{ url_for('track_order',trackid=trackid) }}">
                <button class="track">📦 Track Order</button>
            </a>
            <a href="/menu/{{ session['table_no'] }}">
                <button class="menu">🍽 Continue Ordering</button>
            </a>
        </div>
    </div>
</body>
</html>
