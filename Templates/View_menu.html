<!DOCTYPE html>
<html>
<head>
    <title>Scan2Dine - View Menu</title>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            color:#333;
        }
        .container{
            width:95%;
            max-width:1200px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 18px rgba(0,0,0,.12);
        }
        h1{
            text-align:center;
            color:#d35400;
            margin:5px 0 30px;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        th{
            background:#d35400;
            color:white;
            padding:13px;
            text-align:center;
        }
        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }
        tr:hover{
            background:#fff8f2;
        }
        .edit{
            background:#2980b9;
            color:white;
        }
        .delete{
            background:#e74c3c;
            color:white;
        }
        button{
            border:none;
            padding:9px 15px;
            border-radius:6px;
            cursor:pointer;
            font-size:14px;
        }
        button:hover{
            opacity:.85;
        }
        .back{
            display:inline-block;
            margin-top:25px;
            background:#e67e22;
            color:white;
            padding:11px 22px;
            border-radius:6px;
            text-decoration:none;
        }
        .bottom{
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽 Restaurant Menu</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Dish Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Description</th>
                <th>Available</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            {% for item in menu %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>₹{{ item[3] }}</td>
                <td>{{ item[4] }}</td>
                <td>{{ item[5] }}</td>
                <td>
                    <a href="/edit_menu/{{ item[0] }}">
                        <button class="edit">✏️ Edit</button>
                    </a>
                </td>
                <td>
                    <a href="/delete_menu/{{ item[0] }}"
                       onclick="return confirm('Are you sure you want to delete this item?');">
                        <button class="delete">🗑️ Delete</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>
        <div class="bottom">
            <a class="back" href="/dashboard">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
