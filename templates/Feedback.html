<!DOCTYPE html>
<html>
<head>
    <title>Customer Feedback - Scan2Dine</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 30px; margin: 50px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #111827; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: white; padding: 12px; border: none; border-radius: 5px; margin-top: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h2>💬 Customer Feedback</h2>
    <form method="POST">
        <label>Your Name:</label>
        <input type="text" name="customer_name" required placeholder="Enter your name">

        <label>Rating:</label>
        <select name="rating" required>
            <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
            <option value="4">⭐⭐⭐⭐ (Very Good)</option>
            <option value="3">⭐⭐⭐ (Average)</option>
            <option value="2">⭐⭐ (Poor)</option>
            <option value="1">⭐ (Terrible)</option>
        </select>

        <label>Comments / Suggestions:</label>
        <textarea name="comments" rows="4" placeholder="Tell us about your experience..."></textarea>

        <button type="submit">Submit Feedback</button>
    </form>
</div>

</body>
</html>
