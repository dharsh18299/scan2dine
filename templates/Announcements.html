<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 25px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: #5b21b6;
            font-weight: bold;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nav-links a:hover {
            background: #5b21b6;
            color: white;
        }
        h1 {
            color: #5b21b6;
        }
        .announcement {
            background: white;
            margin-bottom: 20px;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #7c3aed;
        }
        .announcement h2 {
            margin-top: 0;
            color: #5b21b6;
        }
        .announcement p {
            color: #374151;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .date {
            color: #9ca3af;
            font-size: 13px;
        }
        .empty {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-links">
        <a href="{{ url_for('home') }}">← Back to Home</a>
    </div>

    <h1>📢 Restaurant Announcements</h1>

    {% if announcements %}
        {% for announcement in announcements %}
            <div class="announcement">
                <h2>{{ announcement[1] }}</h2>
                <p>{{ announcement[2] }}</p>
                <div class="date">
                    {{ announcement[3] }}
                </div>
            </div>
        {% endfor %}
    {% else %}
        <div class="empty">
            <h2>No announcements right now.</h2>
            <p>Please check again later.</p>
        </div>
    {% endif %}
</div>

</body>
</html>
