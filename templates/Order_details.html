<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .order-details-container {
            max-width: 800px;
            margin: auto;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            margin-top: 0;
            color: #f1f5f9;
        }
        .badge {
            background-color: #3b82f6;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .items-table th, .items-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .items-table th {
            background-color: #0f172a;
            color: #94a3b8;
        }
        .status-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .status-controls p {
            width: 100%;
            margin: 0 0 10px 0;
            color: #94a3b8;
            font-weight: bold;
        }
        .btn-preparing {
            background-color: #f59e0b;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-preparing:hover {
            background-color: #d97706;
        }
        .btn-ready {
            background-color: #10b981;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-ready:hover {
            background-color: #059669;
        }
        .btn-completed {
            background-color: #6366f1;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-completed:hover {
            background-color: #4f46e5;
        }
        .btn-back {
            background-color: #475569;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-left: auto;
        }
        .btn-back:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="order-details-container">
        <h2>Details for Order #{{ order_id }}</h2>
        <p>Current Status: <span class="badge">{{ status }}</span></p>

        <table class="items-table">
            <thead>
                <tr>
                    <th>Dish Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Spice Level</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item[0] }}</td>
                    <td>{{ item[1] }}</td>
                    <td>₹{{ item[2] }}</td>
                    <td>{{ item[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="status-controls">
            <p>Change Status To:</p>
            <a href="{{ url_for('update_order_status', order_id=order_id, status='Preparing') }}" class="btn-preparing">Preparing</a>
            <a href="{{ url_for('update_order_status', order_id=order_id, status='Ready') }}" class="btn-ready">Ready</a>
            <a href="{{ url_for('update_order_status', order_id=order_id, status='Completed') }}" class="btn-completed">Completed</a>
            <a href="{{ url_for('admin_orders') }}" class="btn-back">Back to All Orders</a>
        </div>
    </div>

</body>
</html>
