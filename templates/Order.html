<!DOCTYPE html>
<html>

<head>

<title>Order Item - Scan2Dine</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
}

.container{
    width:450px;
    max-width:90%;
    margin:40px auto;
    background:white;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    padding:25px;
    text-align:center;
}

h1{
    color:#d35400;
    margin-bottom:20px;
}

.details{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

.details td{
    padding:10px;
    font-size:18px;
    text-align:left;
}

.label{
    font-weight:bold;
    width:45%;
}

.price{
    color:green;
    font-weight:bold;
}

.description{
    font-size:16px;
}

.quantity-box{
    margin-top:20px;
}

.quantity-box h3{
    margin-bottom:10px;
}

input[type=number]{
    width:90%;
    padding:12px;
    font-size:18px;
    text-align:center;
    border-radius:6px;
    border:1px solid gray;
}

.spice-box{
    margin-top:20px;
    padding:18px;
    background:#fff7ed;
    border:1px solid #f5c16c;
    border-radius:10px;
}

.spice-title{
    font-size:20px;
    font-weight:bold;
    color:#d35400;
    margin-bottom:12px;
}

.spice-select{
    width:90%;
    padding:12px;
    font-size:17px;
    border-radius:6px;
    border:1px solid gray;
    background:white;
}

.spice-description{
    margin-top:10px;
    font-size:13px;
    color:#666;
}

.spice-example{
    margin-top:12px;
    text-align:left;
    font-size:14px;
    line-height:1.7;
}

button{
    width:100%;
    padding:14px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#219150;
}

.back{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#d35400;
    font-weight:bold;
}

</style>

</head>


<body>

{% include "Navbar.html" %}


<div class="container">

<h1>{{ item[1] }}</h1>


<table class="details">

<tr>

<td class="label">
Category
</td>

<td>
{{ item[2] }}
</td>

</tr>


<tr>

<td class="label">
Price
</td>

<td class="price">
₹{{ item[3] }}
</td>

</tr>


<tr>

<td class="label">
Description
</td>

<td class="description">
{{ item[4] }}
</td>

</tr>


<tr>

<td class="label">
Availability
</td>

<td>
{{ item[5] }}
</td>

</tr>

</table>


<form method="POST">


<div class="quantity-box">

<h3>
Quantity
</h3>

<input
    type="number"
    name="quantity"
    value="1"
    min="1"
    required>

</div>


<div class="spice-box">

<div class="spice-title">
🌶️ Choose Spice Level
</div>


<select
    class="spice-select"
    name="spice_level"
    required>

<option value="Mild">
🟢 Mild
</option>

<option value="Medium" selected>
🟡 Medium
</option>

<option value="Spicy">
🔴 Spicy
</option>

</select>


<div class="spice-description">
Choose how spicy you want your food.
</div>


<div class="spice-example">

🟢 <b>Mild</b> – Very little spice<br>

🟡 <b>Medium</b> – Normal spice<br>

🔴 <b>Spicy</b> – Extra spicy

</div>

</div>


<button type="submit">

🛒 Add to Cart

</button>


</form>


<a
    class="back"
    href="{{ url_for('menu', table_no=session['table_no']) }}">

⬅ Back to Menu

</a>


</div>

</body>

</html>
