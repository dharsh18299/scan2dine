<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Trivia - Scan2Dine</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; text-align: center; padding: 40px; color: #334155; }
        .card { background: white; max-width: 450px; margin: auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-option { display: block; width: 100%; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 12px; margin: 10px 0; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-option:hover { background: #e2e8f0; }
        .back-btn { display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🧠 Food Trivia Challenge</h2>
        <p style="font-size: 18px; font-weight: bold; margin: 20px 0;">{{ question.q }}</p>
        
        <div id="options-container">
            {% for opt in question.options %}
                <button class="btn-option" onclick="checkAnswer('{{ opt }}', '{{ question.answer }}')">{{ opt }}</button>
            {% endfor %}
        </div>

        <p id="result-text" style="font-weight: bold; margin-top: 15px; font-size: 18px;"></p>

        <a href="/trivia" id="next-btn" style="display:none;" class="btn-option" style="background:#22c55e; color:white;">Play Another Question</a>
        <br>
        <a href="/menu/{{ table_no }}" class="back-btn">← Back to Menu</a>
    </div>

    <script>
        function checkAnswer(selected, correct) {
            const resultText = document.getElementById("result-text");
            if (selected === correct) {
                resultText.style.color = "#16a34a";
                resultText.innerHTML = "🎉 Correct! Great job!";
            } else {
                resultText.style.color = "#dc2626";
                resultText.innerHTML = "❌ Oops! The correct answer was: " + correct;
            }
            // Hide options and show next button
            document.querySelectorAll('.btn-option').forEach(btn => btn.style.display = 'none');
            document.getElementById('next-btn').style.display = 'block';
        }
    </script>
</body>
</html>
